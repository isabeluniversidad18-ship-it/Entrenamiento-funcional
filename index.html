function bk(sh){S.cfg.lastBk=iso();save();const t=JSON.stringify(S),n='copia-entrenos-'+iso()+'.json';if(sh&&navigator.canShare){const f=new File([t],n,{type:'application/json'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:n}).catch(()=>{});R();return}}dl(n,t,'application/json');R()}
const bkBanner=()=>{const l=S.cfg.lastBk,n=l?Math.round((Date.now()-new Date(l+'T12:00'))/864e5):99;if(!Object.keys(S.cl).length||n<7||S.cfg.snz==iso())return'';return`<div class="card" style="border-color:var(--a)"><b>Copia de seguridad</b><p class="m" style="margin:4px 0 8px">${l?'Hace '+n+' días que no descargas una copia.':'Todavía no has descargado ninguna copia.'} Los datos solo están en este dispositivo.</p><button class="p" onclick="bk()">Descargar ahora</button> ${navigator.canShare?'<button onclick="bk(1)">Enviar</button> ':''}<button onclick="S.cfg.snz=iso();save();R()">Más tarde</button></div>`};
function boot(){const go2=()=>{R();snap(iso());syNow();try{navigator.storage.persist()}catch(e){}};if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});lst();if(localStorage.getItem(PK))lock(go2);else go2()}
const SK='gestor_sync_v1',SY={at:null,exp:0,tm:0,busy:0,ch:0,m:''};
const syG=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}},syS=o=>localStorage.setItem(SK,JSON.stringify(o));
const syUI=()=>{const e=document.getElementById('sy');if(e)e.textContent=SY.m};
if(typeof addEventListener=='function')addEventListener('online',()=>syNow());
function syMark(){const c=syG();if(!c||!c.t)return;SY.ch++;c.d=1;syS(c);clearTimeout(SY.tm);SY.tm=setTimeout(syNow,3000)}
async function syAuth(c){if(SY.at&&Date.now()<SY.exp-6e4)return SY.at;const r=await fetch(c.u+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:c.k,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:c.t})});if(!r.ok)throw new Error('auth');const j=await r.json();SY.at=j.access_token;SY.exp=Date.now()+j.expires_in*1e3;c.t=j.refresh_token;syS(c);return SY.at}
const sq=async(c,p,o={})=>{const at=await syAuth(c);return fetch(c.u+'/rest/v1/gestor'+p,{method:o.method,body:o.body,headers:{apikey:c.k,Authorization:'Bearer '+at,'Content-Type':'application/json',...(o.h||{})}})};
async function syNow(){const c=syG();if(!c||!c.t||SY.busy)return;SY.busy=1;const n0=SY.ch;let again=0;
try{SY.m='Sincronizando…';syUI();const g=await sq(c,'?select=ts,data&user_id=eq.'+c.uid);if(!g.ok)throw 0;const r=(await g.json())[0],adopt=()=>{snap(ant(),1);S=r.data;fix();save0();c.base=r.ts;c.d=0;R()};
if(!r){const t=Date.now(),p=await sq(c,'',{method:'POST',body:JSON.stringify({ts:t,data:S}),h:{Prefer:'return=minimal'}});if(!p.ok)throw 0;c.base=t;c.d=SY.ch==n0?0:1}
else if(r.ts==c.base){if(c.d){const t=Math.max(Date.now(),c.base+1),p=await sq(c,'?user_id=eq.'+c.uid+'&ts=eq.'+c.base,{method:'PATCH',body:JSON.stringify({ts:t,data:S}),h:{Prefer:'return=representation'}});if(!p.ok)throw 0;if((await p.json()).length){c.base=t;c.d=SY.ch==n0?0:1}else again=1}}
else if(!c.d&&(c.base||!(Object.keys(S.cl).length||S.mk.length)))adopt();
else if(confirm('Hay datos distintos en la nube y en este dispositivo.\n\nAceptar = usar los de la NUBE (se guarda una copia de los de este dispositivo).\nCancelar = usar los de ESTE dispositivo (se guarda una copia de la nube).'))adopt();
else{snap(ant()+'n',1,JSON.stringify(r.data));c.base=r.ts;c.d=1;again=1}
syS(c);SY.m='Sincronizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});if(c.d)again=1}
catch(e){SY.m=e&&e.message=='auth'?'La sesión ha caducado: desconecta y vuelve a conectar.':navigator.onLine===false?'Sin conexión: se enviará al volver.':'No se pudo sincronizar. Se reintentará.'}
SY.busy=0;syUI();if(again)setTimeout(syNow,1500)}
async function syConnect(){const u=gv('su').trim().replace(/\/+$/,''),k=gv('sk').trim(),e=gv('se').trim(),p=gv('sp');if(!/^https:\/\//.test(u)||!k||!e||!p){alert('Rellena la URL, la clave, el correo y la contraseña.');return}
try{const r=await fetch(u+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:k,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});if(!r.ok){alert('Correo o contraseña incorrectos, o la URL o la clave no son válidas.');return}const j=await r.json();SY.at=j.access_token;SY.exp=Date.now()+j.expires_in*1e3;syS({u,k,e,t:j.refresh_token,uid:j.user.id,base:0,d:0});await syNow();R()}catch(x){alert('No se pudo conectar. Revisa la conexión.')}}
function syOff(){if(confirm('¿Desconectar? Los datos se quedan en este dispositivo y en la nube.')){localStorage.removeItem(SK);SY.at=null;R()}}
function syCode(){const c=syG(),t=btoa(unescape(encodeURIComponent(JSON.stringify({u:c.u,k:c.k,e:c.e}))));if(navigator.share)navigator.share({text:t}).catch(()=>{});else prompt('Copia este código y pégalo en el otro dispositivo (no incluye la contraseña):',t)}
function syCodeUse(){try{const o=JSON.parse(decodeURIComponent(escape(atob(gv('sc').trim()))));document.getElementById('su').value=o.u;document.getElementById('sk').value=o.k;document.getElementById('se').value=o.e;alert('Datos cargados. Escribe la contraseña y pulsa Conectar.')}catch(e){alert('Código no válido.')}}
const syCard=()=>{const c=syG(),on=c&&c.t;return`<div class="card"><h3>Sincronización entre dispositivos</h3>${on?`<p class="m" id="sy">${esc(SY.m||'Conectado')}</p><p class="m">Cuenta: ${esc(c.e)}${c.d?' · cambios pendientes de enviar':''}</p><button class="p" onclick="syNow()">Sincronizar ahora</button> <button onclick="syCode()">Código para otro dispositivo</button> <button onclick="syOff()">Desconectar</button>`:`<p class="m">Guarda los datos en tu cuenta de Supabase para usarlos en el móvil y en el ordenador (guía en Guia_sincronizacion.md).</p><input id="sc" placeholder="Código de otro dispositivo (opcional)" style="width:100%"> <button onclick="syCodeUse()">Usar código</button><input id="su" placeholder="https://xxxx.supabase.co" style="width:100%"><input id="sk" placeholder="Clave pública (sb_publishable_… o anon)" style="width:100%"><input id="se" type="email" placeholder="Correo" style="width:100%"><input id="sp" type="password" placeholder="Contraseña" style="width:100%"><button class="p big" onclick="syConnect()">Conectar</button>`}</div>`};
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function cfg(){return`<h2>Configuración y datos</h2>${syCard()}${instCard()}${secCard()}${snapCard()}<div class="card"><h3>Datos del informe</h3><label class="m">Centro<input style="width:100%" value="${esc(S.cfg.centro)}" oninput="S.cfg.centro=this.value;save()"></label><label class="m">Instructor/a<input style="width:100%" value="${esc(S.cfg.instr)}" oninput="S.cfg.instr=this.value;save()"></label><label class="m">Duración de la clase (minutos)<input type="number" min="10" value="${S.cfg.dur}" oninput="S.cfg.dur=+this.value||60;save()"></label></div><div class="card"><p>Los datos se guardan automáticamente en este navegador y dispositivo. Se pierden si borras los datos del navegador, y no se comparten entre dispositivos. Haz una copia de seguridad cada semana.</p><button class="p" onclick="bk()">Descargar copia de seguridad (JSON)</button>${navigator.canShare?' <button onclick="bk(1)">Enviar copia (WhatsApp, correo…)</button>':''} <button onclick="ex()">Exportar a Excel (CSV)</button> <button onclick="mcsv(null,1)">Exportar marcas (CSV)</button><p>Restaurar copia:<br><input type="file" accept=".json" onchange="im(this)"></p><button class="no" onclick="if(confirm('¿Borrar TODOS los datos?')){snap(ant(),1).then(()=>{localStorage.removeItem(K);location.reload()})}">Borrar todo</button></div>`}
function ex(){const r=['Fecha;Grupo;Participante;Asistencia;RPE individual;RPE general;Observaciones'];recs().forEach(x=>Object.keys(x.c.a).forEach(i=>r.push([x.d,x.g,pn(i),x.c.a[i]===1?'Presente':'Ausente',x.c.r[i]||'',x.c.rg||'','"'+(x.c.ob||'').replace(/"/g,'""')+'"'].join(';'))));dl('asistencia-rpe.csv','\ufeff'+r.join('\n'),'text/csv')}
function im(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.p||!d.cl)throw 0;if(confirm('Se reemplazarán los datos actuales. ¿Continuar?')){snap(ant(),1);S=d;fix();save();R()}}catch(e){alert('Archivo no válido')}};rd.readAsText(f)}
boot();
</script></body></html>
